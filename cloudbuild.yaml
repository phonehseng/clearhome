# Automatic redeploy: a Cloud Build trigger runs this on every push to main (setup: DEPLOY.md, "Automatic deploys").
# Same result as the manual `gcloud run deploy --source .`: the service keeps its secrets, env vars and limits,
# only the code changes.
steps:
  # Listing photos aren't in git, so download them first (a provider that blocks us is skipped, not fatal).
  - id: photos
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install --quiet requests Pillow && python backend/listing_photos.py || true; mkdir -p .cache/listing-photos"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}", "--image", "${_IMAGE}:${SHORT_SHA}", "--region", "${_REGION}", "--quiet"]

substitutions:
  _SERVICE: clear-house
  _REGION: us-east4
  # The repository `gcloud run deploy --source` already created for this service.
  _IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/clear-house

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
timeout: 1200s
