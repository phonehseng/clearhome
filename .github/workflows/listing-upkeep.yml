# Keeps the listings current without anyone having to remember. Every day it:
#   1. pulls new open-data records into the review queue (backend/sources.py),
#   2. has Gemini look for new listings in the next two areas: thinking first, Google Search, then a second reading
#      of each source page whose quotes are matched by code (backend/discover.py). Finds that pass every check from a
#      provider's own page go live, labeled as added automatically and flagged on /review; the rest wait in the queue,
#   3. renews listings their providers still offer and takes down ones they don't (backend/freshness.py),
#   4. checks the catalog and runs the tests, then commits and pushes any data changes to main and redeploys the site.
# One-time setup (two secrets, and a Google Cloud service account for deploys): DEPLOY.md, "Automatic listing upkeep".
name: Listing upkeep

on:
  schedule:
    - cron: "30 9 * * *"  # every day at 9:30 UTC (5:30 am Eastern)
  workflow_dispatch:
    inputs:
      publish:
        description: Publish new finds that pass every check (otherwise they wait in the review queue)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: listing-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}
      # Set the repository variable AUTO_PUBLISH to 0 to send every new find to the review queue instead.
      AUTO_PUBLISH: ${{ (vars.AUTO_PUBLISH == '0' || (github.event_name == 'workflow_dispatch' && !inputs.publish)) && '0' || '1' }}
      DISCOVERY_GAP_SECONDS: "4"
      FRESHNESS_GAP_SECONDS: "4"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: New open-data records into the review queue
        run: python backend/sources.py --force

      - name: Gemini looks for new listings
        if: env.GEMINI_API_KEY != ''
        run: python backend/discover.py --areas 2

      - name: Renew listings still offered, take down ones that aren't
        if: env.GEMINI_API_KEY != ''
        run: python backend/freshness.py --limit 60

      - name: Catalog and tests still pass
        run: |
          python backend/catalog.py --check
          python -m unittest discover -s backend -p "test_[!g]*.py"

      - name: Commit and push
        id: push
        run: |
          git config user.name "clear-house-upkeep"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing changed today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Listing upkeep $(date -u +%F): new finds, renewals and take-downs (automated; see the run summary)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sign in to Google Cloud
        if: steps.push.outputs.changed == 'true' && env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install gcloud
        if: steps.push.outputs.changed == 'true' && env.HAS_GCP == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy the updated site
        if: steps.push.outputs.changed == 'true' && env.HAS_GCP == 'true'
        run: |
          python backend/listing_photos.py || true  # photos ship with the app; a provider that blocks us is skipped
          mkdir -p .cache/listing-photos
          gcloud run deploy clear-house --source . --region us-east4 --project gen-lang-client-0995218526 --quiet
